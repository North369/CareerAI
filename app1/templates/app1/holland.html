<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Holland - CareerAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #0f172a; 
            font-family: sans-serif;
        }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f172a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50;
            transition: opacity 0.5s ease;
        }

        .bot-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .loader {
            border: 4px solid #1e293b; border-top: 4px solid #6366f1;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader mb-4"></div>
        <h2 class="text-white text-xl font-semibold">Hệ thống Trắc nghiệm Holland</h2>
        <p class="text-slate-400 mt-2">Đang thiết lập bài kiểm tra năng lực...</p>
    </div>

    <div class="bot-container">
    <iframe 
        id="ai-bot-holland"
        /* Thêm conversationId để tách biệt dữ liệu với trang CV */
        src="https://cdn.botpress.cloud/webchat/v3.6/shareable.html?configUrl=https://files.bpcontent.cloud/2026/02/27/12/20260227120927-YAOXEZEY.json" 
        allow="geolocation; microphone; camera; clipboard-read; clipboard-write;"
        onload="hideLoading()">
    </iframe>
</div>

    <script>
        function hideLoading() {
            const loader = document.getElementById('loading-screen');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 500);
            }
        }
        setTimeout(hideLoading, 5000);
    </script>
</body>
</html>
