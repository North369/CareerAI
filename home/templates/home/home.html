<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerAI - Định hướng tương lai cùng AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
            background-color: #ffffff;
        }

        .gradient-text {
            background: linear-gradient(90deg, #4f46e5, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Lớp nền overlay */
        .ai-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px) saturate(180%);
            z-index: 9999; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: all 0.4s ease;
        }

        .card-container {
            background: #f1f3f5; border-radius: 40px; padding: 48px;
            max-width: 900px; width: 100%; position: relative;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.1);
        }

        .feature-button {
            background: white; border: 1.5px solid rgba(0, 0, 0, 0.1); 
            border-radius: 32px; padding: 28px; display: flex;
            align-items: center; gap: 20px; transition: 0.3s; width: 100%;
        }

        .feature-button:hover {
            transform: translateY(-5px); border-color: #6366f1;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.05);
        }

        .icon-box { width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .bg-quiz { background-color: #e0e7ff; color: #4f46e5; }
        .bg-cv { background-color: #f3e8ff; color: #9333ea; }
        .no-scroll { overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50">

    <div id="ai-modal-overlay" class="ai-overlay">
        <div class="card-container text-center">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-2xl text-slate-400 hover:text-red-500 transition">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="text-3xl font-bold text-slate-900 mb-10">Tôi có thể giúp gì cho bạn?</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <a href="/app1/holland-test/" class="feature-button">
                    <div class="icon-box bg-quiz"><i class="fas fa-clipboard-list"></i></div>
                    <div class="text-left">
                        <h3 class="font-bold text-xl">Đồng hành đạt ngành</h3>
                        <p class="text-slate-500 text-sm">Từng bước vào ngành bạn đã chọn</p>
                    </div>
                </a>

                <a href="/app1/" class="feature-button">
                    <div class="icon-box bg-cv"><i class="fas fa-file-alt"></i></div>
                    <div class="text-left">
                        <h3 class="font-bold text-xl">Làm trắc nghiệm AI</h3>
                        <p class="text-slate-500 text-sm">Tìm ra nghề nghiệp phù hợp</p>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <nav class="p-8 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white"><i class="fas fa-brain"></i></div>
            <span class="text-xl font-bold tracking-tight">CareerAI</span>
            
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-4 py-20 text-center">
        <h1 class="text-5xl md:text-7xl font-extrabold mb-6 leading-tight">
            Định hướng nghề nghiệp <br>
            <span class="gradient-text">Thông minh hơn với AI</span>
        </h1>
        <p class="text-xl text-slate-600 max-w-2xl mx-auto mb-10">
            Sử dụng thuật toán AI để phân tích tiềm năng và kết nối bạn với công việc mơ ước.
        </p>
        
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            
            
            <button onclick="openModal()" class="bg-white text-slate-900 border-2 border-slate-200 px-8 py-4 rounded-xl font-bold hover:bg-slate-50 transition">
                Bắt đầu ngay
            </button>
        </div>
    </header>

    <script>
        function openModal() {
            const modal = document.getElementById('ai-modal-overlay');
            modal.style.display = 'flex';
            setTimeout(() => { modal.style.opacity = '1'; }, 10);
            document.body.classList.add('no-scroll');
        }

        function closeModal() {
            const modal = document.getElementById('ai-modal-overlay');
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 400);
            document.body.classList.remove('no-scroll');
        }
    </script>
</body>
</html>
